name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate index.html and v2/index.html
        run: |
          for f in index.html v2/index.html; do
            test -s "$f" || { echo "$f missing or empty"; exit 1; }
            if grep -Eiq '<script[^>]+src=|<link[^>]+href=' "$f"; then
              echo "External script/link found in $f; the no-CDN rule forbids this"
              grep -Ein '<script[^>]+src=|<link[^>]+href=' "$f"
              exit 1
            fi
          done
          grep -q 'Content-Security-Policy' v2/index.html || { echo "v2 must keep its CSP meta tag"; exit 1; }

      - name: HTML check (non-blocking)
        continue-on-error: true
        run: npx --yes html-validate index.html v2/index.html

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/v2
          cp index.html _site/
          cp v2/index.html _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
