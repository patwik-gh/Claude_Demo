<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
/* ============ Design tokens: palette + spacing scale ============ */
:root {
  --blue-900: #0a2540;
  --blue-700: #0b4f9c;
  --blue-600: #1262c4;
  --blue-100: #e3eefb;
  --blue-50:  #f3f7fc;
  --ink: #1b2733;
  --ink-soft: #55657a;
  --line: #d5dde8;
  --white: #ffffff;
  --red: #c62828;
  --red-bg: #fdeaea;
  --amber: #e08a00;
  --amber-bg: #fff3d9;
  --grey: #8593a3;
  --grey-bg: #eceff3;
  --green: #1e7b45;
  --green-bg: #e3f4ea;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font); color: var(--ink);
  background: var(--blue-50); line-height: 1.4; font-size: 14px;
}
:focus-visible { outline: 3px solid var(--blue-600); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ============ Header + summary strip ============ */
.app-header {
  background: var(--blue-900); color: var(--white);
  padding: var(--s3) var(--s5);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4);
}
.wordmark { font-weight: 800; font-size: 20px; letter-spacing: .08em; display: flex; align-items: center; gap: var(--s2); }
.wordmark svg { width: 24px; height: 24px; }
.wordmark small { font-weight: 400; letter-spacing: 0; opacity: .8; font-size: 13px; }
.summary { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; flex: 1; }
.summary li {
  background: rgba(255,255,255,.12); border-radius: var(--radius);
  padding: var(--s1) var(--s3); font-size: 12px; white-space: nowrap;
}
.summary strong { font-size: 16px; margin-left: var(--s1); }
.summary .stat-overdue { background: var(--red); }

/* ============ Buttons ============ */
.btn {
  border: 1px solid var(--blue-600); background: var(--blue-600); color: var(--white);
  padding: var(--s2) var(--s4); border-radius: var(--radius); font-weight: 600;
}
.btn:hover { background: var(--blue-700); }
.btn:disabled { opacity: .65; cursor: progress; }
.btn-ghost { background: var(--white); color: var(--blue-700); }
.btn-ghost:hover { background: var(--blue-100); }
.app-header .btn { background: var(--white); color: var(--blue-900); border-color: var(--white); }
.app-header .btn:hover { background: var(--blue-100); }

/* ============ Filter bar ============ */
.filters {
  display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end;
  padding: var(--s3) var(--s5); background: var(--white); border-bottom: 1px solid var(--line);
}
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--ink-soft); gap: var(--s1); }
.filters select, .filters input { padding: 6px var(--s2); border: 1px solid var(--line); border-radius: 6px; background: var(--white); min-width: 160px; }
.note { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

/* ============ Board ============ */
main { padding: var(--s5); }
.board { display: flex; gap: var(--s4); align-items: flex-start; }
.column {
  flex: 1 1 0; min-width: 0; background: var(--blue-100); border: 2px solid transparent;
  border-radius: var(--radius); padding: var(--s3); min-height: 200px;
}
.column.drop-target { border-color: var(--blue-600); background: #cfe2f8; border-style: dashed; }
.column-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 var(--s3); }
.column-head h2 { margin: 0; font-size: 15px; color: var(--blue-900); }
.badge {
  background: var(--blue-700); color: var(--white); border-radius: 999px;
  padding: 1px var(--s2); font-size: 12px; font-weight: 700; min-width: 24px; text-align: center;
}
.col-hint { font-size: 11px; color: var(--ink-soft); margin: 0 0 var(--s2); }
.cards { display: flex; flex-direction: column; gap: var(--s3); min-height: 60px; }
.empty { color: var(--ink-soft); font-style: italic; font-size: 12px; text-align: center; padding: var(--s4) 0; }

/* ============ Cards ============ */
.card {
  background: var(--white); border-radius: var(--radius); padding: var(--s3);
  border-left: 6px solid var(--blue-600); box-shadow: 0 1px 2px rgba(10,37,64,.15);
  cursor: grab; position: relative;
}
.card.dragging { opacity: .45; }
.card.p-critical { border-left-color: var(--red); }
.card.p-high { border-left-color: var(--amber); }
.card.p-medium { border-left-color: var(--blue-600); }
.card.p-low { border-left-color: var(--grey); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.card-id { font-size: 11px; font-weight: 700; color: var(--ink-soft); font-family: ui-monospace, Menlo, Consolas, monospace; }
.card h3 { margin: var(--s1) 0; font-size: 14px; overflow-wrap: anywhere; }
.card .meta { font-size: 12px; color: var(--ink-soft); margin: 2px 0; overflow-wrap: anywhere; }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--s1); margin: var(--s2) 0; }
.pill, .tag, .overdue {
  font-size: 11px; font-weight: 700; padding: 1px var(--s2); border-radius: 999px; display: inline-block;
}
.pill-critical { background: var(--red-bg); color: var(--red); }
.pill-high { background: var(--amber-bg); color: #8a5500; }
.pill-medium { background: var(--blue-100); color: var(--blue-700); }
.pill-low { background: var(--grey-bg); color: #4a5866; }
.tag { background: var(--white); border: 1px solid var(--line); color: var(--ink-soft); font-weight: 600; }
.overdue { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.card-actions { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); flex-wrap: wrap; }
.card-actions select { padding: 3px var(--s1); border: 1px solid var(--line); border-radius: 6px; background: var(--white); font-size: 12px; }
.icon-btn { border: 1px solid transparent; background: transparent; color: var(--ink-soft); font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 6px; }
.icon-btn:hover { background: var(--red-bg); color: var(--red); }
.confirm { display: flex; align-items: center; gap: var(--s2); font-size: 12px; font-weight: 600; color: var(--red); }
.confirm button { border: 1px solid var(--line); background: var(--white); border-radius: 6px; padding: 2px var(--s2); font-size: 12px; }
.confirm .yes { background: var(--red); color: var(--white); border-color: var(--red); }

/* ============ Modal form ============ */
dialog { border: none; border-radius: var(--radius); padding: 0; width: min(560px, 94vw); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,37,64,.55); }
.form-head { display: flex; justify-content: space-between; align-items: center; background: var(--blue-900); color: var(--white); padding: var(--s3) var(--s4); }
.form-head h2 { margin: 0; font-size: 16px; }
.form-head .icon-btn { color: var(--white); }
.form-head .icon-btn:hover { background: rgba(255,255,255,.2); color: var(--white); }
form { padding: var(--s4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field.full { grid-column: 1 / -1; }
.field label { font-weight: 600; font-size: 13px; }
.field input, .field select, .field textarea { padding: var(--s2); border: 1px solid var(--line); border-radius: 6px; background: var(--white); width: 100%; }
.field textarea { resize: vertical; min-height: 70px; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); background: var(--red-bg); }
.error { color: var(--red); font-size: 12px; min-height: 0; }
.error:empty { display: none; }
.req { color: var(--red); }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--s2); }

/* ============ Toasts ============ */
.toasts { position: fixed; right: var(--s4); bottom: var(--s4); display: flex; flex-direction: column; gap: var(--s2); z-index: 10; max-width: min(360px, 92vw); }
.toast { padding: var(--s3) var(--s4); border-radius: var(--radius); color: var(--white); font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.toast-success { background: var(--green); }
.toast-warn { background: #8a5500; }

/* ============ Responsive ============ */
@media (max-width: 767px) {
  .board { flex-direction: column; }
  .column { width: 100%; flex: none; }
  main, .filters, .app-header { padding-left: var(--s3); padding-right: var(--s3); }
  form { grid-template-columns: 1fr; }
  .note { margin-left: 0; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wordmark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 8h10M7 12h10M7 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    IT PMO <small>Project Board · demo</small>
  </div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn" id="openAdd">+ Add Task</button>
</header>

<section class="filters" aria-label="Board filters">
  <label for="fProject">Project
    <select id="fProject"></select>
  </label>
  <label for="fAssignee">Assignee contains
    <input id="fAssignee" type="search" placeholder="e.g. Tan">
  </label>
  <label for="fPriority">Priority
    <select id="fPriority"></select>
  </label>
  <button type="button" class="btn btn-ghost" id="clearFilters">Clear filters</button>
  <span class="note">Demo data lives in memory only — refreshing the page resets the board.</span>
</section>

<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<dialog id="addDialog" aria-labelledby="addTitle">
  <div class="form-head">
    <h2 id="addTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeAdd" aria-label="Close add task form">×</button>
  </div>
  <form id="taskForm" novalidate>
    <div class="field full">
      <label for="title">Task Title <span class="req">*</span></label>
      <input id="title" name="title" type="text" maxlength="80" autocomplete="off">
      <div class="error" id="err-title" role="alert"></div>
    </div>
    <div class="field full">
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500"></textarea>
      <div class="error" id="err-description" role="alert"></div>
    </div>
    <div class="field">
      <label for="project">Project / Workstream</label>
      <select id="project" name="project"></select>
      <div class="error" id="err-project" role="alert"></div>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category"></select>
      <div class="error" id="err-category" role="alert"></div>
    </div>
    <div class="field">
      <label for="assignee">Assignee <span class="req">*</span></label>
      <input id="assignee" name="assignee" type="text" maxlength="60" autocomplete="off">
      <div class="error" id="err-assignee" role="alert"></div>
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select id="priority" name="priority"></select>
      <div class="error" id="err-priority" role="alert"></div>
    </div>
    <div class="field">
      <label for="dueDate">Due Date <span class="req">*</span></label>
      <input id="dueDate" name="dueDate" type="date">
      <div class="error" id="err-dueDate" role="alert"></div>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status"></select>
      <div class="error" id="err-status" role="alert"></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="cancelAdd">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
/* ==========================================================================
   CONFIG
   --------------------------------------------------------------------------
   <!-- FormSubmit requires a ONE-TIME ACTIVATION: the first submission sends
        a confirmation email to the address below. Notifications are only
        delivered after the link in that email is clicked. Until then (and
        while the placeholder address is in place) the request fails and the
        board shows a non-blocking warning. -->
   ========================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const ID_PREFIX = "UOB-ITPM-";
const REQUEST_TIMEOUT_MS = 10000;

/* ==========================================================================
   Constants (fixed lists)
   ========================================================================== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on dependency, vendor or approval",
  "Done": "Completed / closed"
};
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PRIORITY_GLYPH = { Critical: "▲▲", High: "▲", Medium: "●", Low: "▼" };

/* ==========================================================================
   State: single source of truth (in memory only, no storage APIs)
   ========================================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  confirmDeleteId: null,   // card currently showing inline "Delete? Yes / No"
  focusKey: null           // element to refocus after a re-render
};

/* ==========================================================================
   Helpers
   ========================================================================== */
// Escape user-supplied strings before they go into HTML.
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Local-date YYYY-MM-DD (avoids UTC shifting from toISOString).
function toIsoDate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function todayIso() { return toIsoDate(new Date()); }
function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toIsoDate(d);
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayIso(); }
function nextTaskId() { return ID_PREFIX + String(state.nextId++).padStart(4, "0"); }
function optionsHtml(list, blankLabel) {
  const blank = blankLabel ? '<option value="">' + escapeHtml(blankLabel) + "</option>" : "";
  return blank + list.map(v => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>").join("");
}

/* ==========================================================================
   Seed data (8 demo tasks)
   ========================================================================== */
function seedTasks() {
  const mk = (title, description, project, category, assignee, priority, due, status) =>
    ({ id: nextTaskId(), title, description, project, category, assignee, priority, dueDate: offsetDate(due), status });
  state.tasks = [
    mk("Migrate FX pricing service to AWS", "Lift and shift the FX pricing microservice; cutover rehearsal pending.", "Infrastructure & Cloud", "Infrastructure", "Wei Ling Tan", "High", 21, "In Progress"),
    mk("Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to teller VDI golden image.", "Cybersecurity Uplift", "Cybersecurity", "Arjun Nair", "Critical", -2, "In Progress"),
    mk("UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for release 4.2 test cycle.", "Digital Channels", "Application Development", "Priya Raman", "High", 5, "Blocked"),
    mk("Core ledger interface mapping workshop", "Map legacy ledger fields to the new interface spec.", "Core Banking Upgrade", "Application Development", "Daniel Lim", "Medium", 14, "Backlog"),
    mk("Renew data warehouse licence", "Commercial renewal and true-up review with vendor.", "Vendor Management", "Vendor", "Siti Aminah", "Medium", 30, "Backlog"),
    mk("Customer 360 data lineage documentation", "Document upstream sources for regulatory reporting.", "Data & Analytics", "Data", "Marcus Ong", "Low", 45, "Backlog"),
    mk("Quarterly access recertification", "Complete privileged access review for production systems.", "Cybersecurity Uplift", "Compliance", "Grace Chua", "High", -6, "Blocked"),
    mk("Decommission legacy SFTP gateway", "Gateway shut down and firewall rules removed.", "Infrastructure & Cloud", "Infrastructure", "Ravi Menon", "Low", -10, "Done")
  ];
}

/* ==========================================================================
   Filtering
   ========================================================================== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(t =>
    (!f.project || t.project === f.project) &&
    (!f.priority || t.priority === f.priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ==========================================================================
   Rendering (the only place card DOM is built)
   ========================================================================== */
function renderCard(task) {
  const overdue = isOverdue(task)
    ? '<span class="overdue">⚠ Overdue</span>' : "";
  const pClass = task.priority.toLowerCase();
  const confirming = state.confirmDeleteId === task.id;
  const moveOptions = '<option value="">Move ▸</option>' +
    STATUSES.filter(s => s !== task.status)
      .map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + "</option>").join("");

  const actions = confirming
    ? '<div class="confirm" role="group" aria-label="Confirm delete ' + escapeHtml(task.id) + '">Delete? ' +
        '<button type="button" class="yes" data-action="delete-yes" data-id="' + escapeHtml(task.id) + '" data-focus="yes-' + escapeHtml(task.id) + '">Yes</button>' +
        '<button type="button" data-action="delete-no" data-id="' + escapeHtml(task.id) + '" data-focus="no-' + escapeHtml(task.id) + '">No</button></div>'
    : '<select data-action="move" data-id="' + escapeHtml(task.id) + '" data-focus="move-' + escapeHtml(task.id) + '" aria-label="Move ' + escapeHtml(task.id) + ' to another column">' + moveOptions + "</select>" +
      '<button type="button" class="icon-btn" data-action="delete-ask" data-id="' + escapeHtml(task.id) + '" data-focus="del-' + escapeHtml(task.id) + '" aria-label="Delete task ' + escapeHtml(task.id) + '">×</button>';

  return '<article class="card p-' + pClass + '" draggable="true" data-id="' + escapeHtml(task.id) + '">' +
    '<div class="card-top"><span class="card-id">' + escapeHtml(task.id) + "</span>" + overdue + "</div>" +
    "<h3>" + escapeHtml(task.title) + "</h3>" +
    '<div class="meta">📁 ' + escapeHtml(task.project) + "</div>" +
    '<div class="meta">👤 ' + escapeHtml(task.assignee) + "</div>" +
    '<div class="meta">📅 Due ' + escapeHtml(formatDate(task.dueDate)) + "</div>" +
    '<div class="card-tags"><span class="pill pill-' + pClass + '">' + PRIORITY_GLYPH[task.priority] + " " + escapeHtml(task.priority) + "</span>" +
    '<span class="tag">' + escapeHtml(task.category) + "</span></div>" +
    '<div class="card-actions">' + actions + "</div></article>";
}

function renderSummary() {
  const all = state.tasks;
  const parts = ['<li>Total<strong>' + all.length + "</strong></li>"];
  STATUSES.forEach(s => {
    parts.push("<li>" + escapeHtml(s) + "<strong>" + all.filter(t => t.status === s).length + "</strong></li>");
  });
  parts.push('<li class="stat-overdue">Overdue<strong>' + all.filter(isOverdue).length + "</strong></li>");
  document.getElementById("summary").innerHTML = parts.join("");
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const html = STATUSES.map(status => {
    const cards = visible.filter(t => t.status === status);
    return '<section class="column" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-head"><h2>' + escapeHtml(status) + '</h2><span class="badge" aria-label="' + cards.length + ' tasks">' + cards.length + "</span></div>" +
      '<p class="col-hint">' + escapeHtml(STATUS_HINTS[status]) + "</p>" +
      '<div class="cards">' + (cards.length ? cards.map(renderCard).join("") : '<div class="empty">No tasks</div>') + "</div></section>";
  }).join("");
  document.getElementById("board").innerHTML = html;
  renderSummary();

  if (state.focusKey) {
    const el = document.querySelector('[data-focus="' + state.focusKey + '"]');
    if (el) el.focus();
    state.focusKey = null;
  }
}

/* ==========================================================================
   Task operations (mutate state, then re-render)
   ========================================================================== */
function addTask(fields) {
  const task = Object.assign({ id: nextTaskId() }, fields);
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return;
  task.status = newStatus;
  state.focusKey = "move-" + id;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.confirmDeleteId = null;
  renderBoard();
}

/* ==========================================================================
   Toasts
   ========================================================================== */
function showToast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast toast-" + (kind || "success");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ==========================================================================
   FormSubmit notification (parallel to optimistic UI; failure never breaks board)
   ========================================================================== */
async function notifyNewTask(task) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ==========================================================================
   Form: validation + submit
   ========================================================================== */
function readForm() {
  const f = document.getElementById("taskForm");
  return {
    title: f.title.value.trim(),
    description: f.description.value.trim(),
    project: f.project.value,
    category: f.category.value,
    assignee: f.assignee.value.trim(),
    priority: f.priority.value,
    dueDate: f.dueDate.value,
    status: f.status.value
  };
}

function validateTask(v) {
  const errors = {};
  if (!v.title) errors.title = "Task title is required.";
  else if (v.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (v.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(v.project)) errors.project = "Choose a project.";
  if (!CATEGORIES.includes(v.category)) errors.category = "Choose a category.";
  if (!v.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(v.priority)) errors.priority = "Choose a priority.";
  if (!v.dueDate) errors.dueDate = "Due date is required.";
  else if (v.dueDate < todayIso()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.includes(v.status)) errors.status = "Choose a status.";
  return errors;
}

function showErrors(errors) {
  ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"].forEach(k => {
    const msg = errors[k] || "";
    document.getElementById("err-" + k).textContent = msg;
    const input = document.getElementById(k);
    input.closest(".field").classList.toggle("invalid", !!msg);
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    if (msg) input.setAttribute("aria-describedby", "err-" + k); else input.removeAttribute("aria-describedby");
  });
}

function resetForm() {
  document.getElementById("taskForm").reset();
  document.getElementById("priority").value = "Medium";
  document.getElementById("status").value = "Backlog";
  showErrors({});
}

async function handleSubmit(event) {
  event.preventDefault();
  const values = readForm();
  const errors = validateTask(values);
  showErrors(errors);
  const firstKey = Object.keys(errors)[0];
  if (firstKey) { document.getElementById(firstKey).focus(); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic: card appears immediately; network call runs alongside.
  const task = addTask(values);
  resetForm();
  showToast("Task " + task.id + " added to the board.", "success");

  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
    closeDialog();
  }
}

/* ==========================================================================
   Dialog open / close
   ========================================================================== */
function openDialog() {
  const dlg = document.getElementById("addDialog");
  document.getElementById("dueDate").min = todayIso();
  if (!dlg.open) dlg.showModal();
  document.getElementById("title").focus();
}
function closeDialog() {
  const dlg = document.getElementById("addDialog");
  if (dlg.open) dlg.close();
  document.getElementById("openAdd").focus();
}

/* ==========================================================================
   Drag and drop (native HTML5 DnD, event delegation on the board)
   ========================================================================== */
function setupDragAndDrop() {
  const board = document.getElementById("board");
  let draggedId = null;

  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    draggedId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    draggedId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(el => el.classList.remove("dragging", "drop-target"));
  });
  board.addEventListener("dragover", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach(el => { if (el !== col) el.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", e => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    const id = draggedId;
    draggedId = null;
    moveTask(id, col.dataset.status);
  });
}

/* ==========================================================================
   Init + event wiring
   ========================================================================== */
function init() {
  // Populate selects from the fixed lists.
  document.getElementById("fProject").innerHTML = optionsHtml(PROJECTS, "All projects");
  document.getElementById("fPriority").innerHTML = optionsHtml(PRIORITIES, "All priorities");
  document.getElementById("project").innerHTML = optionsHtml(PROJECTS);
  document.getElementById("category").innerHTML = optionsHtml(CATEGORIES);
  document.getElementById("priority").innerHTML = optionsHtml(PRIORITIES);
  document.getElementById("status").innerHTML = optionsHtml(STATUSES);
  resetForm();

  seedTasks();
  renderBoard();
  setupDragAndDrop();

  // Filters
  const onFilter = () => {
    state.filters.project = document.getElementById("fProject").value;
    state.filters.priority = document.getElementById("fPriority").value;
    state.filters.assignee = document.getElementById("fAssignee").value;
    renderBoard();
  };
  ["fProject", "fPriority"].forEach(id => document.getElementById(id).addEventListener("change", onFilter));
  document.getElementById("fAssignee").addEventListener("input", onFilter);
  document.getElementById("clearFilters").addEventListener("click", () => {
    document.getElementById("fProject").value = "";
    document.getElementById("fPriority").value = "";
    document.getElementById("fAssignee").value = "";
    onFilter();
  });

  // Card actions (move select, inline delete confirm)
  const board = document.getElementById("board");
  board.addEventListener("change", e => {
    const el = e.target.closest('[data-action="move"]');
    if (el && el.value) moveTask(el.dataset.id, el.value);
  });
  board.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete-ask") { state.confirmDeleteId = id; state.focusKey = "no-" + id; renderBoard(); }
    else if (btn.dataset.action === "delete-no") { state.confirmDeleteId = null; state.focusKey = "del-" + id; renderBoard(); }
    else if (btn.dataset.action === "delete-yes") { deleteTask(id); }
  });

  // Dialog + form
  document.getElementById("openAdd").addEventListener("click", openDialog);
  document.getElementById("closeAdd").addEventListener("click", closeDialog);
  document.getElementById("cancelAdd").addEventListener("click", closeDialog);
  document.getElementById("taskForm").addEventListener("submit", handleSubmit);
}

init();
</script>
</body>
